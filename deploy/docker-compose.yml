# ════════════════════════════════════════════════════════════════════════════
# deploy/docker-compose.yml — runs lundqwist.se on the Synology NAS with Container Manager.
#
# Two containers:
#   personalsite      the new site (C# API + React), which visitors reach
#   personalsite-v1   the first version, shown under https://lundqwist.se/v1/
#
# Lives on the NAS in  /volume1/docker/personalsite/  next to:
#   site/   the published new site (copied there by deploy.ps1)
#   app/    the published first version (copied there by deploy.ps1)
#   keys/   v1's encryption keys for login cookies (created automatically)
#   showcase/  your own files and websites, served at /showcase (never touched by deploys)
#   .env    the database connection string (secret, see .env.example)
#
# Both use Microsoft's official .NET 8 runtime image, so no image has to be
# built: each container just runs its published .dll.
# ════════════════════════════════════════════════════════════════════════════

services:
  personalsite:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: personalsite
    # Start again automatically after a crash or a NAS restart
    restart: unless-stopped
    # Use the NAS's own network. The site then reaches the database at
    # 192.168.50.2 like any machine on the LAN, DSM's reverse proxy reaches
    # the site at localhost:8090, and the site reaches v1 at localhost:8091.
    network_mode: host
    working_dir: /app
    command: ["dotnet", "Lundqwist.Site.dll"]
    depends_on:
      - personalsite-v1
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Listen only on the NAS itself; visitors come in through the reverse proxy (HTTPS)
      - ASPNETCORE_URLS=http://127.0.0.1:8090
      # Plain-http requests are redirected to https on port 443
      - ASPNETCORE_HTTPS_PORT=443
      # The database connection string, read from the .env file
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      # Where requests for /v1/... are passed on to
      - V1__Address=http://127.0.0.1:8091
      - TZ=Europe/Stockholm
    volumes:
      # The published site, read-only inside the container
      - ./site:/app:ro

  personalsite-v1:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: personalsite-v1
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["dotnet", "PersonalSite.dll"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Only the new site talks to this one
      - ASPNETCORE_URLS=http://127.0.0.1:8091
      - ASPNETCORE_HTTPS_PORT=443
      # The site lives under https://lundqwist.se/v1/
      - PathBase=/v1
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      # Keep the cookie encryption keys outside the container (survive restarts)
      - DataProtection__KeysPath=/keys
      # Your own files and small websites, served at https://lundqwist.se/showcase/
      - Showcase__Path=/showcase
      - TZ=Europe/Stockholm
    volumes:
      - ./app:/app:ro
      - ./keys:/keys
      # The showcase folder (put files there via \\LUNARBASE\docker\personalsite\showcase)
      - ./showcase:/showcase:ro
